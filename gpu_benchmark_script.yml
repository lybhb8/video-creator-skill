# Video Script — 单卡 7900XTX 运行 Qwen 27B 本地大模型

sections:
  - title: "【开场】7900XTX 本地 AI 测评"
    time_range: "0:00 - 1:00"
    content:
      - type: "画面描述"
        text: "AMD RX 7900 XTX 产品图 + 标题卡片"
      - type: "解说词"
        text: |
          一张 AMD RX 7900 XTX，24GB 显存，跑本地大模型是什么体验？
          这是 AMD 2022 年底推出的 RDNA3 架构旗舰卡，96 个计算单元，6144 个流处理器，24GB GDDR6，显存位宽 384-bit。
          游戏性能比上一代 6900XT 强约百分之四十，是同价位段最强的高清游戏卡之一。
          但今天我们要看的是它的另一面——跑本地大模型。
      - type: "解说词"
        text: |
          本次测试覆盖 Qwen3.6 和 Qwen3.8 两个版本，五种推理方案：Vulkan、ROCm、TurboQuant、DFlash、SGLang，逐一比拼。
          目标只有一个：找出 7900XTX 上最快的本地 AI 方案。
        tts_text: |
          本次测试覆盖 Qwen3.6 和 Qwen3.8 两个版本，五种推理方案：Vulkan、ROCm、TurboQuant、DFlash、SGLang，逐一比拼。
          目标只有一个：找出 7900XTX 上最快的本地 AI 方案。
      - type: "画面描述"
        text: "关键发现文字动画：Vulkan 比 ROCm 快 38-80%"

  - title: "【硬件环境】平台配置"
    time_range: "1:00 - 1:45"
    content:
      - type: "画面描述"
        text: "测试平台规格表：GPU/CPU/内存/系统/ReBAR"
      - type: "解说词"
        text: |
          先看一下完整的测试平台。
          GPU：AMD Radeon RX 7900 XTX，24GB GDDR6，RDNA3 架构，gfx1100。
          CPU：Xeon E5-2696 v4，24 核 48 线程。
          内存：64GB DDR4。
          系统：Ubuntu 22.04 或 24.04。
      - type: "解说词"
        text: |
           所有测试使用 llama.cpp 编译，后端分别测试 Vulkan 和 ROCm/HIP。
           Qwen3.6 和 Qwen3.8 两个模型版本都覆盖了。
           注意：ReBAR 必须在 BIOS 中开启，否则 tg128 性能暴跌至 13.9 t/s，开启后 37 t/s 以上，差距 2.7 倍。
        tts_text: |
          所有测试使用 llama.cpp 编译，后端分别测试 Vulkan 和 ROCm HIP。
          Qwen3.6 和 Qwen3.8 两个模型版本都覆盖了。
          注意：ReBAR 必须在 BIOS 中开启，否则 tg128 性能暴跌至 13.9 t/s，开启后 37 t/s 以上，差距 2.7 倍。

  - title: "【BIOS设置】ReBAR等关键项"
    time_range: "1:45 - 2:25"
    content:
      - type: "画面描述"
        text: "BIOS 设置卡片：ReBAR / Above 4G Decoding / PCIe Gen4 / 电源管理 / C-States"
      - type: "解说词"
        text: |
          ReBAR 是 RDNA3 上最重要的 BIOS 设置，没有之一。
          必须在 BIOS 中开启 Resizable BAR，否则 tg128 仅 13.9 t/s，开启后 37 t/s 以上，差距 2.7 倍。
      - type: "解说词"
        text: |
          Above 4G Decoding 必须同时开启，与 ReBAR 配套。
          PCIe Link Speed 设为 Gen4，勿用 Gen3。
          电源管理设高性能模式，sudo pm-is-supported --force-high。
          C-States 可关闭以减轻 GPU 利用率波动。
        tts_text: |
          Above 4G Decoding 必须同时开启，与 ReBAR 配套。
          PCIe Link Speed 设为 Gen4，勿用 Gen3。
          电源管理设高性能模式，sudo pm-is-supported --force-high。
          C-States 可关闭以减轻 GPU 利用率波动。

  - title: "【环境准备】安装与下载"
    time_range: "1:45 - 3:00"
    content:
      - type: "画面描述"
        text: "终端动画：ROCm 安装 + rocminfo 验证 + huggingface-cli 下载模型"
      - type: "解说词"
        text: |
          第一步，安装 ROCm。在 Ubuntu 上添加 AMD 仓库，执行 amdgpu-install，把当前用户加入 render 和 video 组。
      - type: "解说词"
        text: |
          验证 GPU 识别：rocminfo 搜索 gfx1100，rocm-smi 查看 24GB 显存。如果没自动识别，设置 HSA_OVERRIDE_GFX_VERSION 环境变量为 11.0.0。
        tts_text: |
          验证 GPU 识别：rocminfo 搜索 gfx1100，rocm-smi 查看 24GB 显存。如果没自动识别，设置 HSA_OVERRIDE GFX VERSION 环境变量为 11.0.0。
      - type: "解说词"
        text: |
          下载模型：Qwen3.6-27B Q4_K_M MTP 版约 15.8GB，Qwen3.8-27B UD-Q4_K_M 约 16.5GB。
          DFlash 专用草稿模型约 1.7GB，视觉编码器 mmproj 约 0.9GB。
          下载命令用 huggingface-cli download，注意带上 --include 参数只下载需要的文件。
        tts_text: |
          下载模型：Qwen3.6-27B Q4_K_M MTP 版约 15.8GB，Qwen3.8-27B UD-Q4_K_M 约 16.5GB。
          DFlash 专用草稿模型约 1.7GB，视觉编码器 mmproj 约 0.9GB。
          下载命令用 huggingface-cli download，注意带上包含参数只下载需要的文件。

  - title: "【方案总览】五路对比"
    time_range: "3:00 - 4:00"
    content:
      - type: "画面描述"
        text: "五方案对比表格：方案/后端/速度/Context/难度/适用场景（含基线）"
      - type: "解说词"
        text: |
          方案 A，Vulkan 加 MTP：解码 63 到 80 token 每秒，上下文最高 256K，是单用户场景的速度之王。
          方案 B，ROCm 加 MTP：解码 46 到 54 token 每秒，上下文 8K，安装最简单，新手首选。
      - type: "解说词"
        text: |
          方案 C，ROCm TurboQuant：解码 28 到 29 token 每秒，但支持 256K 超长上下文，KV cache 压缩到 3.5 bitperweight。
          方案 D，DFlash 加 PFlash：解码 64 到 86 token 每秒，需要 Lucebox 框架，配置最复杂，但速度上限最高。
          方案 E，SGLang：单流只有 4 到 8 token 每秒，但并发吞吐是 llama.cpp 的两到四倍，适合多用户 API 服务。
        tts_text: |
          方案 C，ROCm TurboQuant：解码 28 到 29 token 每秒，但支持 256K 超长上下文，KV cache 压缩到 3.5 bitperweight。
          方案 D，DFlash 加 PFlash：解码 64 到 86 token 每秒，需要 Lucebox 框架，配置最复杂，但速度上限最高。
          方案 E，SGLang：单流只有 4 到 8 token 每秒，但并发吞吐是 llama.cpp 的两到四倍，适合多用户 API 服务。
      - type: "解说词"
        text: |
          另外还有一组基线数据：ROCm 裸跑约 28 token 每秒，Vulkan 裸跑约 29 到 31 token 每秒，用于对照优化效果。
        tts_text: |
          另外还有一组基线数据：ROCm 裸跑约 28 token 每秒，Vulkan 裸跑约 29 到 31 token 每秒，用于对照优化效果。

  - title: "【速度结果】Benchmark"
    time_range: "4:00 - 5:30"
    content:
      - type: "画面描述"
        text: "双条形图：Qwen3.6 和 Qwen3.8 各方案解码速度对比"
      - type: "解说词"
        text: |
          来看速度实测结果。
          Qwen3.6 版本下，DFlash DDTree 最快，64 到 86 token 每秒。
          Vulkan 加 MTP n_max 等于 4 紧随其后，63 到 80 token 每秒。
          ROCm 加 MTP 46 到 54 token 每秒，比 Vulkan 慢约三成。
          TurboQuant 28 到 29 token 每秒，和裸跑差不多，但换来 256K 上下文。
          SGLang 单流仅 4 到 8 token 每秒，但这是多用户并发的代价。
      - type: "解说词"
        text: |
          关键发现：Vulkan 在 RDNA3 上比 ROCm 快 38 到 80 个百分点。
          原因是 ROCm 在 gfx1100 上 GPU 利用率呈 bursty 波动，而 Vulkan 提供稳定吞吐。
        tts_text: |
          关键发现：Vulkan 在 RDNA3 上比 ROCm 快 38 到 80 个百分点。
          原因是 ROCm 在 gfx1100 上 GPU 利用率呈伯斯蒂波动，而 Vulkan 提供稳定吞吐。
      - type: "解说词"
        text: |
          Qwen3.8 版本相对 3.6 略有不同。MTP 接受率从 79 提升到 85  percent，但绝对解码速度略低，Vulkan 加 MTP n等于 2 约 44 token 每秒。
          3.8 的 Hybrid 架构只有 16 层 KV cache，其余 48 层用线性注意力，这使得 262K 上下文在 24GB 显存上成为可能。
        tts_text: |
          Qwen3.8 版本相对 3.6 略有不同。MTP 接受率从 79 提升到 85 percent，但绝对解码速度略低，Vulkan 加 MTP n等于 2 约 44 token 每秒。
          3.8 的 Hybrid 架构只有 16 层 KV cache，其余 48 层用线性注意力，这使得 262K 上下文在 24GB 显存上成为可能。

  - title: "【架构分析】3.8 vs 3.6"
    time_range: "5:30 - 6:30"
    content:
      - type: "画面描述"
        text: "3.6 vs 3.8 架构对比表：架构/MTP头/Context/工具调用/推理能力"
      - type: "解说词"
        text: |
          Qwen3.8 相比 3.6 有几个关键变化。
          架构从纯 Dense Attention 改为 Hybrid Gated DeltaNet 加 Full Attention。
          全注意力层数从 64 层降为 16 层，其余 48 层改用线性注意力，空间复杂度变为常数。
      - type: "解说词"
        text: |
          MTP 头从单独训练改为用户原生集成，接受率从 79.6 percent 提升到 84.9 percent。
          原生上下文从 32K到128K 扩展到 262144，可扩展至 100万。
          视觉编码器内置，mmproj 可选加载。
      - type: "解说词"
        text: |
          但工具调用稳定性有所退步，论坛反馈 3.8 的工具调用成功率低于 3.6。
          推理和数学能力 3.8 更强，Pure reasoning suite 得分 86.7 percent 对比 73.3 percent。
        tts_text: |
          但工具调用稳定性有所退步，论坛反馈 3.8 的工具调用成功率低于 3.6。
          推理和数学能力 3.8 更强，推理套件得分 86.7 percent 对比 73.3 percent。

  - title: "【量化选择】版本决策"
    time_range: "6:30 - 7:15"
    content:
      - type: "画面描述"
        text: "Qwen3.8 量化版本决策表：UD-Q4/IQ4_XS/TQ3_4S/Q5_K/Q6_K"
      - type: "解说词"
        text: |
          Qwen3.8 的量化版本选择很关键，因为 VRAM 预算比 3.6 更紧张。
          同样 Q4_K_M 量化下，3.8 比 3.6 大约大 700MB。
      - type: "解说词"
        text: |
          UD-Q4_K_M 约 16.5GB，默认首选，128K context 约 21GB，可用但紧凑。
          IQ4_XS 约 15.3GB，最小体积留更多 VRAM 给 context，适合追求最大上下文的场景。
          TQ3_4S 约 13.8GB，TurboQuant 专用，13.8GB 模型加 6.8GB tq3_0 KV cache，总计约 21GB，是 262K 上下文唯一可行方案。
        tts_text: |
          UD-Q4_K_M 约 16.5GB，默认首选，128K context 约 21GB，可用但紧凑。
          IQ4_XS 约 15.3GB，最小体积留更多 VRAM 给 context，适合追求最大上下文的场景。
          TQ3_4S 约 13.8GB，TurboQuant 专用，13.8GB 模型加 6.8GB tq3_0 KV cache，总计约 21GB，是 262K 上下文唯一可行方案。
      - type: "解说词"
        text: |
          UD-Q5_K_M 约 19.4GB，精度更高但 128K context 时约 23.7GB 极紧。
          Q6_K 约 22.9GB，超出 24GB 显存不可行。
        tts_text: |
          UD-Q5_K_M 约 19.4GB，精度更高但 128K context 时约 23.7GB 极紧。
          Q6_K 约 22.9GB，超出 24GB 显存不可行。

  - title: "【VRAM预算】显存够用吗"
    time_range: "7:15 - 8:15"
    content:
      - type: "画面描述"
        text: "双表并列：Qwen3.6 和 Qwen3.8 各场景 VRAM 预算速查"
      - type: "解说词"
        text: |
          24GB 显存够用吗？关键看量化和上下文长度。
          Qwen3.6 Q4_K_M 加 16K context 约 16.6GB，充裕。加 256K context 约 24.1GB，贴顶。
          IQ4_XS 加 256K context 约 22.1GB，是最佳平衡点。
      - type: "解说词"
        text: |
          Qwen3.8 UD-Q4_K_M 加 16K context 约 17.3GB，充裕。加 128K context 约 20.8GB，可用。
          但加 262K context 约 25GB，超出 24GB，必须 headless 模式。
          TQ3_4S 加 262K context 约 21GB，是 262K 最宽松的方案。
        tts_text: |
          Qwen3.8 UD-Q4_K_M 加 16K context 约 17.3GB，充裕。加 128K context 约 20.8GB，可用。
          但加 262K context 约 25GB，超出 24GB，必须 headless 模式。
          TQ3_4S 加 262K context 约 21GB，是 262K 最宽松的方案。

  - title: "【选择建议】按场景选型"
    time_range: "8:15 - 9:15"
    content:
      - type: "画面描述"
        text: "六张选型卡片：极致速度/超长上下文/多用户API/不想折腾/极限加速/工具调用"
      - type: "解说词"
        text: |
          怎么选？
          单用户追求极致速度，选 Vulkan 加 MTP 或 DFlash。Vulkan 设置更简单，DFlash 速度上限更高但配置复杂。
          需要 128K 以上超长上下文，选 TurboQuant 或 DFlash。Qwen3.8 的 Hybrid 架构天然适合这个场景。
      - type: "解说词"
        text: |
          要做多用户 API 服务，选 SGLang。单流虽慢，但并发吞吐和结构化输出能力是 llama.cpp 没有的。
          什么都不想折腾，选 ROCm 加 MTP。一键编译，即刻运行，就是 context 只能到 8K。
      - type: "解说词"
        text: |
          Qwen3.6 还是 3.8？工具调用场景继续用 3.6，3.8 的工具调用稳定性论坛反馈有退步。
          纯推理和数学场景用 3.8，MTP 接受率更高，推理能力强。
        tts_text: |
          Qwen3.6 还是 3.8？工具调用场景继续用 3.6，3.8 的工具调用稳定性论坛反馈有退步。
          纯推理和数学场景用 3.8，MTP 接受率更高，推理能力强。

  - title: "【常见问题】故障排查"
    time_range: "9:15 - 10:15"
    content:
      - type: "画面描述"
        text: "六个常见故障卡片：编译失败/OOM/GPU识别/MTP接受率低/性能低/GTT溢出"
      - type: "解说词"
        text: |
          常见问题排查。
          Vulkan 编译失败：必须用 gcc-11 从 shaderc 源码编译 glslc，不能用 conda-forge 的预编译版本，否则会段错误。
          目标名是 glslc_exe，不是 glslc。
      - type: "解说词"
        text: |
          运行时 OOM：减小 context 到 32K 或 16K，加强 KV cache 量化到 q4_0，或关闭 MTP 去掉 spec-type 参数。
          ROCm 识别不到 GPU：设置 HSA_OVERRIDE_GFX_VERSION 为 11.0.0，检查 lsmod 中 amdgpu 是否加载。
      - type: "解说词"
        text: |
          MTP 接受率低：降低 n_max 到 2 提高接受率，降低温度到 0.3 提高可预测性，关闭 thinking 链。
          GTT 隐式溢出是 AMD 专属坑，Qwen3.8 在 ROCm 下首请求后 decode 骤降 40 percent，切换 Vulkan 后端或减小 context 可解决。
        tts_text: |
          MTP 接受率低：降低 n_max 到 2 提高接受率，降低温度到 0.3 提高可预测性，关闭 thinking 链。
          GTT 隐式溢出是 AMD 专属坑，Qwen3.8 在 ROCm 下首请求后 decode 骤降 40 percent，切换 Vulkan 后端或减小 context 可解决。

  - title: "【结尾】总结"
    time_range: "10:15 - 10:45"
    content:
      - type: "画面描述"
        text: "总结文字 + 完整指南路径"
      - type: "解说词"
        text: |
          总结一下。
          7900XTX 的 24GB 显存，配合正确的后端和量化方案，完全可以流畅运行 27B 参数级别的本地大模型。
      - type: "解说词"
        text: |
          Vulkan 加 MTP 是目前 RDNA3 上综合性能最好的方案。
          Qwen3.8 虽然略慢于 3.6，但 85 percent 的 MTP 接受率和更强的推理能力值得等待。
          完整部署指南和 benchmark 数据已在脚本目录，需要的可以看。
        tts_text: |
          Vulkan 加 MTP 是目前 RDNA3 上综合性能最好的方案。
          Qwen3.8 虽然略慢于 3.6，但 85 percent 的 MTP 接受率和更强的推理能力值得等待。
          完整部署指南和 benchmark 数据已在脚本目录，需要的可以看。
      - type: "解说词"
        text: |
          本期评测就到这里，我们下次见。
        tts_text: |
          本期评测就到这里，我们下次见。

